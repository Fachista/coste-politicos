<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué se podría pagar?</title>
<meta name="description" content="Calculadora: si se recortara una parte del gasto en altos cargos y asesores, ¿a cuántos maestros, enfermeros o médicos equivaldría?">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<nav class="menu" id="menu" aria-label="Secciones"></nav>
<div class="app">
  <h1>¿Qué se podría pagar con ese dinero?</h1>
  <p class="entradilla">Elige un gasto, cuánto recortarías y en qué lo invertirías.</p>

  <div class="calc">
    <section class="tarjeta">
      <label class="campo"><span>1. ¿Qué gasto recortarías?</span>
        <select id="partida"></select>
      </label>
      <label class="campo" id="campo-propio" hidden><span>Importe anual (euros)</span>
        <input type="number" id="propio" min="0" step="100000" value="10000000">
      </label>
      <label class="campo"><span>2. ¿Cuánto? <b id="pct-txt">50 %</b></span>
        <input type="range" id="pct" min="5" max="100" step="5" value="50">
      </label>
      <label class="campo"><span>3. ¿En qué lo invertirías?</span>
        <select id="destino"></select>
      </label>
      <label class="campo" id="campo-sueldo" hidden><span>Sueldo bruto anual (euros)</span>
        <input type="number" id="sueldo" min="1000" step="500" value="30000">
      </label>
    </section>
    <section class="tarjeta resultado-calc" aria-live="polite">
      <div class="det" id="res-ahorro"></div>
      <div class="gran-cifra" id="res-n"></div>
      <div id="res-txt"></div>
      <div class="iconos" id="iconos" aria-hidden="true"></div>
      <p class="nota-pie" id="res-escala"></p>
      <p><button class="boton" id="copiar">Copiar resultado con fuentes</button></p>
    </section>
  </div>

  <footer class="pie"><p id="pie-fuentes"></p></footer>
</div>
<script src="comun.js"></script>
<script src="calculadora.js"></script>
</body>
</html>
