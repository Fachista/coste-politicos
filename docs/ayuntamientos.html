<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu ayuntamiento</title>
<meta name="description" content="Busca tu municipio: cuánto cuestan su alcalde, sus concejales y sus asesores por habitante, y por qué, comparado con municipios de su tamaño.">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<nav class="menu" id="menu" aria-label="Secciones"></nav>
<div class="app">
  <h1>Municipios</h1>
  <p class="entradilla">Alcalde, concejales y asesores de tu municipio, por habitante, frente a los de su tamaño.</p>

  <section class="tarjeta" id="buscador">
    <label for="q" class="titulo">Escribe el nombre de tu municipio</label>
    <input type="search" id="q" autocomplete="off" placeholder="Por ejemplo: Getafe" aria-controls="sugerencias">
    <div id="sugerencias" class="barras" style="margin-top:8px"></div>
  </section>

  <section class="tarjeta seccion" id="ficha" aria-live="polite" hidden></section>

  <section class="tarjeta seccion" id="sin-datos" hidden>
    <div class="aviso-caja"><b>Buscador en preparación.</b> Falta generar la lista completa de municipios con su población. Mientras tanto, aquí tienes los ayuntamientos con más gasto de cada comunidad.</div>
    <label>Comunidad <select id="ccaa"></select></label>
    <div class="barras seccion" id="top"></div>
  </section>

  <footer class="pie"><p id="pie-fuentes"></p></footer>
</div>
<script src="comun.js"></script>
<script src="ayuntamientos.js"></script>
</body>
</html>
